name: Test Suite

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}
  workflow_call: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install hatch
        uses: pypa/hatch@install
      - name: Style and formatting
        run: hatch run lint:check

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]
        # One job on the newest Python, to catch breakage early without tripling CI time.
        # It is also the only job that measures coverage: from 3.14, coverage.py records
        # branches through sys.monitoring at almost no cost, while on 3.12-3.13 its
        # line-by-line tracer slows the suite by ~40% locally and up to 2x on CI.
        include:
          - os: ubuntu-latest
            python-version: "3.14"
            coverage: true

    steps:
      - uses: actions/checkout@v4
        with:
          # hatch-vcs derives the version from tags; without them the build fails.
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install hatch
        uses: pypa/hatch@install

      # The JPL ephemeris kernel is ~120 MB and astropy downloads it on first use.
      # Caching it keeps that to one download rather than one per job.
      - name: Cache astropy downloads
        uses: actions/cache@v4
        with:
          path: ~/.astropy/cache
          key: astropy-cache-${{ runner.os }}-v1

      # Passing any argument replaces test:run's default --cov options; --no-cov makes
      # that intent explicit.
      - name: Test suite
        run: hatch run +py=${{ matrix.python-version }} test:run ${{ !matrix.coverage && '--no-cov' || '' }}

      - name: Report coverage
        if: matrix.coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install hatch
        uses: pypa/hatch@install
      - name: Check the package builds and is installable
        run: hatch run build:check
