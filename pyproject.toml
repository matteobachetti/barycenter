################################################################################
# Build Configuration
################################################################################

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling>1.4.1", "hatch-vcs"]

################################################################################
# Project Configuration
################################################################################

[project]
name = "barycenter"
# You can chose to use dynamic versioning with hatch or static where you add it manually.
dynamic = [
    "urls",
    "version",
]

description = "Barycentric correction a la barycorr, but in Python, using PINT"
authors = [
    { name = "Matteo Bachetti", email = "matteo@matteobachetti.it" },
]
license = "MIT"
requires-python = ">= 3.10" # Adjust based on the minimum version of Python that you support
readme = {"file" = "README.md", "content-type" = "text/markdown"}
# Please consult https://pypi.org/classifiers/ for a full list.
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
]
keywords = [
    "astronomy",
    "barycentric correction",
    "pulsars",
    "timing",
    "X-ray",
]
# Everything imported at module level. The optional extras below cover the
# imports that happen inside a function: s3/HTTP input, region filtering, and
# the --apply-official shell-outs. The CALDB index scrape is deliberately not
# among them: it is how NuSTAR's and Swift's clock files are found when none is
# named, so it has to work in a plain installation, and it uses only the
# standard library.
dependencies = [
    "astropy >= 5.0",
    "numpy",
    "pint-pulsar",
    "scipy",
]


[project.scripts]
barycenter = "barycenter:main_barycenter"

[project.optional-dependencies]
dev = [
    "hatch",
    "pre-commit",
    "ruff",
    "towncrier",
]
test = [
    "pytest",
    "pytest-astropy",
]
# Reading input straight from HEASARC over https or s3.
remote = [
    "astroquery >= 0.4.11",
    "boto3",
    "botocore",
    "fsspec",
    "s3fs",
]
# --source-region-deg
regions = [
    "regions",
]
# Compiles the clock-file interpolation kernel, which is about six times faster than
# the numpy expression it falls back to. Optional because compiling it costs 0.52 s at
# first use while the routine itself is under half a per cent of a run, so it does not
# pay for itself below roughly 50 million events. Results are bit-identical either way.
speed = [
    "numba",
]
recommended = [
    "barycenter[regions,remote]",
]

################################################################################
# Tool Configuration
################################################################################

# Hatch is building your package's wheel and sdist
# This tells hatch to only include Python packages (i.e., folders with __init__.py) in the build.
# read more about package building, here:
# https://www.pyopensci.org/python-package-guide/package-structure-code/python-package-distribution-files-sdist-wheel.html
[tool.hatch.build]
only-packages = true

# This tells Hatch to build the package from the src/me directory.
# Read more about src layouts here: https://www.pyopensci.org/python-package-guide/package-structure-code/python-package-structure.html
[tool.hatch.build.targets.wheel]
packages = ["src/barycenter"]
# only-packages above keeps the build to Python modules, so the bundled RXTE clock
# coefficients have to be named. Without them an RXTE run cannot be clock-corrected
# unless HEASOFT happens to be installed.
force-include = { "src/barycenter/data" = "barycenter/data" }

[tool.hatch.build.targets.sdist]
# Same reason, at the path the sdist rebuilds from.
force-include = { "src/barycenter/data" = "src/barycenter/data" }

######## Linting and formatting ########
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["docs/_build", "docs/api"]

[tool.ruff.lint]
# A deliberately small, flake8-shaped surface: pycodestyle errors and warnings plus
# pyflakes. Widen it only with a reason.
select = ["E", "F", "W"]

[tool.ruff.lint.pycodestyle]
# `ruff format` wraps code at 100 columns, but it cannot split a string literal. Lines
# that are long because of one -- a log message, a URL, an expected doctest output --
# are tolerated up to 120 rather than being contorted by hand.
max-line-length = 120

######## Changelog ########
[tool.towncrier]
package = "barycenter"
package_dir = "src"
directory = "docs/changes"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
underlines = ["", "", ""]
title_format = "## [{version}](https://github.com/matteobachetti/barycenter/tree/{version}) - {project_date}"
issue_format = "[#{issue}](https://github.com/matteobachetti/barycenter/pull/{issue})"

[[tool.towncrier.type]]
directory = "breaking"
name = "Backwards-incompatible changes"
showcontent = true

[[tool.towncrier.type]]
directory = "feature"
name = "New features"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "Bug fixes"
showcontent = true

[[tool.towncrier.type]]
directory = "doc"
name = "Documentation"
showcontent = true

[[tool.towncrier.type]]
directory = "maintenance"
name = "Internal changes"
showcontent = true

######## Configure pytest for your test suite ########
[tool.pytest.ini_options]
testpaths = ["tests"] # Tells pytest what directory tests are in
# raises: pytest-raises. remote_data: pytest-astropy, for tests that hit the network.
markers = ["raises"]
# Network tests are opt-in, with --remote-data.
addopts = "--strict-markers"

[tool.coverage.paths]
source = [
    "src/barycenter",
    "*/site-packages/barycenter",
]
[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/barycenter/_version.py"

[tool.hatch.metadata.hooks.vcs.urls]
Homepage = "https://github.com/matteobachetti/barycenter"
"Source Code" = "https://github.com/matteobachetti/barycenter"
"Bug Tracker" = "https://github.com/matteobachetti/barycenter/issues"
Documentation = "https://barycenter.readthedocs.io"
Download = "https://pypi.org/project/barycenter/#files"

[tool.coverage.run]
# Ensures code coverage is measured for branches (conditional statements with different outcomes) in your code.
branch = true
parallel = true

[tool.coverage.report]
# This configures the output test coverage report
exclude_lines = ["pragma: no cover"]
precision = 2

# Use UV to create Hatch environments
[tool.hatch.envs.default]
installer = "uv"
################################################################################
# Hatch Environments
################################################################################

#--------------- Build and check your package ---------------#

# This table installs the tools you need to test and build your package
[tool.hatch.envs.build]
description = """Test the installation the package."""
dependencies = [
    "pip",
    "twine",
]
detached = true

# This table installs created the command hatch run install:check which will build and check your package.
[tool.hatch.envs.build.scripts]
# `-e hatch-build` is not decoration. Running this script sets HATCH_ENV_ACTIVE to the
# name of the environment the script runs in, and the nested `hatch build` reads that
# variable to pick its builder environment -- which this one is not, so it refuses with
# "is not a builder environment". Naming hatch's own default builder explicitly is what
# breaks the loop; renaming this environment would not, the error would just follow it.
check = [
    "pip check",
    "hatch -e hatch-build build {args:--clean}",
    "twine check dist/*",
]

#--------------- Lint and format ---------------#

[tool.hatch.envs.lint]
description = """Check style and formatting."""
detached = true
dependencies = [
    "ruff",
]

[tool.hatch.envs.lint.scripts]
check = [
    "ruff check {args:.}",
    "ruff format --check --diff {args:.}",
]
fix = [
    "ruff check --fix {args:.}",
    "ruff format {args:.}",
]

#--------------- Run tests ---------------#


[tool.hatch.envs.test]
description = """Run the test suite."""
features = ["regions", "remote"]
extra-dependencies = [
    "pytest",
    # pytest-astropy provides the remote_data marker the network tests use.
    "pytest-astropy",
    "pytest-cov",
    "pytest-raises",
    "pytest-xdist",
]

[[tool.hatch.envs.test.matrix]]
python = ["3.10", "3.11", "3.12", "3.13"]

[tool.hatch.envs.test.scripts]
run = "pytest {args:--cov=barycenter --cov-report=term-missing}"

#--------------- Build and preview your documentation ---------------#

# This sets up a hatch environment with associated dependencies that need to be installed
[tool.hatch.envs.docs]
description = """Build or serve the documentation."""
python = "3.10"
dependencies = [
    "pydata_sphinx_theme ~=0.16",
    "myst-parser ~=4.0",
    "Sphinx ~=8.0",
    "sphinx-autobuild ==2024.10.3"
]

# This table contains the scripts that you can use to build and serve your docs
# hatch run docs:build will build your documentation
# hatch run docs:serve will serve them 'live' on your computer locally
[tool.hatch.envs.docs.scripts]
build = ["sphinx-apidoc -o docs/api src/barycenter", "sphinx-build {args:-W -b html docs docs/_build}"]
serve = ["sphinx-apidoc -o docs/api src/barycenter", "sphinx-autobuild docs --watch src/barycenter {args:-b html docs/_build/serve}"]

#--------------- Check security for your dependencies ---------------#

[tool.hatch.envs.audit]
description = """Check dependencies for security vulnerabilities."""
extra-dependencies = [
    "pip-audit",
]

[tool.hatch.envs.audit.scripts]
check = ["pip-audit"]

#--------------- Typing ---------------#
